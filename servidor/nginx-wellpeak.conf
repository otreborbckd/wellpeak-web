# /etc/nginx/sites-available/wellpeak  (enlace en sites-enabled)
# Copia de la configuración en producción (98.94.177.86). Los bloques
# "managed by Certbot" los agregó Certbot; el certificado se renueva solo.
# root apunta al clon del repositorio: los bloques "No publicar" impiden
# servir .git, el código del servidor y los archivos internos.

server {
    server_name wellpeak.com.mx www.wellpeak.com.mx;

    root /srv/wellpeak;
    index index.html;
    server_tokens off;

    # Redirige www a la versión sin www
    if ($host = www.wellpeak.com.mx) { return 301 https://wellpeak.com.mx$request_uri; }

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # No publicar: ocultos (.git, .gitignore), servidor, PDF locales y archivos internos
    location ~ /\.(?!well-known/) { return 404; }
    location ^~ /servidor/  { return 404; }
    location ^~ /descargas/ { return 404; }   # los PDF se sirven desde S3
    location ~* \.(md|sh|env|json|ejemplo|service|conf)$ { return 404; }

    # Caché: archivos de diseño 7 días; config.js y páginas sin caché larga
    location ~* \.(png|jpg|jpeg|webp|svg|ico|css)$ { expires 7d; add_header Cache-Control "public"; }
    location = /assets/js/config.js { expires -1; add_header Cache-Control "no-cache"; }

    # Formulario de contacto -> servicio Node.js local (wellpeak-contacto, puerto 3001)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 32k;
    }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /index.html;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wellpeak.com.mx/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wellpeak.com.mx/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.wellpeak.com.mx) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = wellpeak.com.mx) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name wellpeak.com.mx www.wellpeak.com.mx;
    return 404; # managed by Certbot
}
