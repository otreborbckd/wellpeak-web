# /etc/nginx/sites-available/wellpeak  (enlace en sites-enabled)
# El certificado HTTPS lo agrega Certbot (ver la guía, paso 6).
# root apunta al clon del repositorio: los bloques "No publicar" impiden
# servir .git, el código del servidor y los archivos internos.

server {
    listen 80;
    server_name wellpeak.com.mx www.wellpeak.com.mx;

    root /srv/wellpeak;
    index index.html;
    server_tokens off;

    # Redirige www a la versión sin www
    if ($host = www.wellpeak.com.mx) { return 301 https://wellpeak.com.mx$request_uri; }

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # No publicar: ocultos (.git, .gitignore), servidor, PDF locales y archivos internos
    location ~ /\.(?!well-known/) { return 404; }
    location ^~ /servidor/  { return 404; }
    location ^~ /descargas/ { return 404; }   # los PDF se sirven desde S3
    location ~* \.(md|sh|env|json|ejemplo|service|conf)$ { return 404; }

    # Caché: archivos de diseño 7 días; config.js y páginas sin caché larga
    location ~* \.(png|jpg|jpeg|webp|svg|ico|css)$ { expires 7d; add_header Cache-Control "public"; }
    location = /assets/js/config.js { expires -1; add_header Cache-Control "no-cache"; }

    # Formulario de contacto -> servicio Node.js local
    # NO IMPLEMENTADO POR AHORA: descomentar cuando el servicio (SES) esté instalado.
    # Mientras tanto el formulario muestra "No pudimos enviar tu solicitud...".
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3001;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    #     client_max_body_size 32k;
    # }

    location /{ try_files $uri $uri/ =404; }
    error_page 404 /index.html;
}
