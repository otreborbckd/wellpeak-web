# /etc/nginx/conf.d/wellpeak.conf  (o sites-available/wellpeak en Ubuntu)
# El certificado HTTPS lo agrega Certbot (ver la guía, paso 5).

server {
    listen 80;
    server_name wellpeak.com.mx www.wellpeak.com.mx;

    root /var/www/wellpeak;
    index index.html;

    # Redirige www a la versión sin www
    if ($host = www.wellpeak.com.mx) { return 301 https://wellpeak.com.mx$request_uri; }

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Caché: archivos de diseño 7 días; config.js y páginas sin caché larga
    location ~* \.(png|jpg|jpeg|webp|svg|ico|css)$ { expires 7d; add_header Cache-Control "public"; }
    location = /assets/js/config.js { expires -1; add_header Cache-Control "no-cache"; }

    # Formulario de contacto -> servicio Node.js local
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 32k;
    }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /index.html;
}
